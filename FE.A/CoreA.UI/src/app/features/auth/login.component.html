

<div class="login-layout">
  <app-loading *ngIf="isLoading"></app-loading>
  <div class="login-bg"></div>
  <div class="login-right">
    <div class="login-card">
      <div class="login-header">
        <h2>Sign In</h2>
        <p>Welcome back! Please login to your account.</p>
      </div>
      <form (ngSubmit)="login()" autocomplete="off">
        <mat-card>
          <mat-card-content>
            <mat-form-field appearance="fill" style="width:100%;">
              <mat-label>Username</mat-label>
              <input matInput [(ngModel)]="username" name="username" id="username" required placeholder="Enter your username" />
            </mat-form-field>
            <mat-form-field appearance="fill" style="width:100%;">
              <mat-label>Password</mat-label>
              <input matInput [(ngModel)]="password" name="password" id="password" [type]="showPassword ? 'text' : 'password'" required placeholder="Enter your password" />
              <button mat-icon-button matSuffix type="button" (click)="toggleShowPassword()">
                <mat-icon>{{ showPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
              </button>
            </mat-form-field>
            <button mat-raised-button color="primary" class="login-btn animated-btn modern" type="submit">Login</button>
          </mat-card-content>
        </mat-card>
      </form>
    </div>
  </div>
</div>
