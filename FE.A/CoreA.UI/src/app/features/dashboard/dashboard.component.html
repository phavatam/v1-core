
<mat-sidenav-container class="dashboard-container">
  <mat-sidenav mode="side" opened class="dashboard-sider" fixedInViewport="true" [style.width.px]="220">
    <div class="logo">CoreA.UI</div>
    <mat-nav-list>
      <mat-list-item>
        <mat-icon>dashboard</mat-icon>
        <span>Dashboard</span>
      </mat-list-item>
      <mat-list-item>
        <mat-icon>person</mat-icon>
        <span>User</span>
      </mat-list-item>
      <mat-list-item>
        <mat-icon>settings</mat-icon>
        <span>Settings</span>
      </mat-list-item>
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <mat-toolbar color="primary" class="dashboard-header">
      <div class="header-content" style="width:100%; display:flex; justify-content:space-between; align-items:center;">
        <div class="user-info" style="display:flex; align-items:center; gap:8px;">
          <mat-icon>person</mat-icon>
          <span class="username">Admin</span>
          <button mat-button color="accent" class="logout-btn">Logout</button>
        </div>
        <div class="notifications">
          <mat-icon>notifications</mat-icon>
        </div>
      </div>
    </mat-toolbar>
    <div class="dashboard-content">
      <div class="main-content">
        <h2>Welcome to Dashboard</h2>
        <p>This is the main content area.</p>
      </div>
    </div>
    <mat-toolbar color="primary" class="dashboard-footer" style="margin-top:24px; justify-content:center;">
      © 2025 CoreA.UI. All rights reserved. | <a href="#" style="color:white;">Support</a>
    </mat-toolbar>
  </mat-sidenav-content>
</mat-sidenav-container>
