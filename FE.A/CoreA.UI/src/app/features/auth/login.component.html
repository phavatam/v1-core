

<div class="login-layout">
  <app-loading *ngIf="isLoading"></app-loading>
  <div class="login-bg"></div>
  <div class="login-right">
    <div class="login-card">
      <div class="login-header">
        <h2>Sign In</h2>
        <p>Welcome back! Please login to your account.</p>
      </div>
      <form nz-form (ngSubmit)="login()" autocomplete="off">
        <nz-form-item>
          <nz-form-label [nzFor]="'username'" nzRequired>Username</nz-form-label>
          <nz-form-control [nzSpan]="24">
            <div class="input-icon-group modern">
                <span class="input-icon"><i nz-icon nzType="user"></i></span>
              <input nz-input [(ngModel)]="username" name="username" id="username" required placeholder="Enter your username" />
            </div>
            <!-- Đã bỏ alert lỗi, chỉ show toast notification -->
          </nz-form-control>
        </nz-form-item>
        <nz-form-item>
          <nz-form-label [nzFor]="'password'" nzRequired>Password</nz-form-label>
          <nz-form-control [nzSpan]="24">
            <div class="input-icon-group modern">
                <span class="input-icon"><i nz-icon nzType="lock"></i></span>
              <input nz-input [(ngModel)]="password" name="password" id="password" [type]="showPassword ? 'text' : 'password'" required placeholder="Enter your password" />
              <button type="button" class="show-hide-btn modern" (click)="toggleShowPassword()">
                <i nz-icon [nzType]="showPassword ? 'eye-invisible' : 'eye'"></i>
              </button>
            </div>
            <!-- Đã bỏ alert lỗi, chỉ show toast notification -->
          </nz-form-control>
        </nz-form-item>
        <button nz-button nzType="primary" class="login-btn animated-btn modern" type="submit">Login</button>
        <!-- Đã bỏ alert lỗi, chỉ show toast notification -->
      </form>
    </div>
  </div>
</div>
